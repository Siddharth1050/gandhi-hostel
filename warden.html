<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2240">
<title>Gandhi Hostel - Warden Desk</title>
<style>
  :root{--navy:#0d2240;--navy-2:#1a3a6b;--gold:#b8923e;--paper:#eef1f6;--line:#d3d9e3;--ink:#101a2e;--muted:#5a667c;--ok:#17794a;--err:#b42318;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.45;min-height:100vh;-webkit-text-size-adjust:100%}
  .masthead{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);text-align:center;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 70px}
  .crest{width:46px;height:46px;display:block;margin:0 auto 8px}
  .masthead h1{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0 0 2px}
  .masthead p{margin:0;font-size:.9rem;color:#c9d4e8}
  .sheet{max-width:480px;margin:-48px auto 0;padding:0 14px calc(30px + env(safe-area-inset-bottom,0px))}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(13,34,64,.14);padding:22px}
  .card h2{font-family:var(--serif);font-size:1.2rem;color:var(--navy);margin:0 0 4px}
  .sub{margin:0 0 18px;font-size:.88rem;color:var(--muted)}
  .field{margin-bottom:16px}
  label{display:block;font-size:.86rem;font-weight:600;color:var(--navy);margin-bottom:7px}
  input{width:100%;font:inherit;font-size:1rem;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:#f8f9fc;color:var(--ink)}
  input:focus{outline:none;background:#fff;border-color:var(--navy-2);box-shadow:0 0 0 4px rgba(26,58,107,.14)}
  input.invalid{border-color:var(--err);background:#fff7f6}
  .pw{position:relative}
  .pw input{padding-right:70px}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:.84rem;font-weight:600;color:var(--navy-2);background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
  .btn{width:100%;font:inherit;font-size:1.02rem;font-weight:600;padding:15px;border:0;border-radius:10px;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,var(--navy-2),var(--navy));box-shadow:0 2px 0 var(--gold),0 8px 16px rgba(13,34,64,.22)}
  .btn:disabled{opacity:.6}
  .link{display:block;margin:14px auto 0;font:inherit;font-size:.92rem;font-weight:600;color:var(--navy-2);background:none;border:0;cursor:pointer;text-decoration:underline;padding:6px}
  .btn:focus-visible,.link:focus-visible,.tab:focus-visible,.pw-toggle:focus-visible,.act:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .notice{background:#fff7e0;border:1px solid #ecd48a;color:#6b5210;border-radius:10px;padding:12px 14px;font-size:.86rem;margin-bottom:14px}
  .msg{font-size:.86rem;margin:0 0 12px}
  .msg.bad{color:var(--err)}
  .msg.good{color:var(--ok);font-weight:600}
  .hide{display:none}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:#fff}
  .bar span{font-size:.86rem;color:var(--muted);word-break:break-all}
  .out{font:inherit;font-size:.86rem;font-weight:600;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;box-shadow:0 8px 22px rgba(13,34,64,.12)}
  .tab{flex:1;font:inherit;font-weight:600;font-size:.95rem;padding:12px 8px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--navy);color:#fff}
  .item{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .item.in{border-left-color:var(--ok)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .nm{font-family:var(--serif);font-size:1.15rem;color:var(--navy);margin:0;word-break:break-word}
  .tag{font-size:.78rem;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
  .tag.out{background:#fdf1d6;color:#7a5a10;border:0;padding:4px 9px;cursor:default}
  .tag.in{background:#dcf3e6;color:var(--ok)}
  .meta{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
  .acts{display:flex;gap:10px;margin-top:12px}
  .act{flex:1;font:inherit;font-weight:600;font-size:.98rem;padding:13px;border-radius:10px;border:0;cursor:pointer;color:#fff}
  .act.ok{background:var(--ok)}
  .act.no{background:#fff;color:var(--err);border:1.5px solid var(--err)}
  .act:disabled{opacity:.55}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;background:#fff;border:1px dashed var(--line);border-radius:12px}
</style>
</head>
<body>

<header class="masthead">
  <svg class="crest" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M32 4l22 8v18c0 14-9 25-22 30C19 55 10 44 10 30V12l22-8z" stroke="#b8923e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 33l12-10 12 10v10H36v-7h-8v7h-8V33z" fill="#b8923e"/>
  </svg>
  <h1>Gandhi Hostel</h1>
  <p>Warden Desk</p>
</header>

<main class="sheet">

  <!-- Sign in / forgot password -->
  <section class="card" id="authView">
    <div class="notice hide" id="setupNotice">Not connected yet. Open the file and set <b>DB_URL</b> and <b>API_KEY</b> near the top of the script.</div>

    <div id="paneIn">
      <h2>Warden sign in</h2>
      <p class="sub">Use the email and password of your warden account.</p>
      <div class="field"><label for="siEmail">Email</label>
        <input id="siEmail" type="email" autocomplete="email" placeholder="warden@example.com"></div>
      <div class="field"><label for="siPass">Password</label>
        <div class="pw"><input id="siPass" type="password" autocomplete="current-password" placeholder="Your password"><button class="pw-toggle" id="pwBtn" type="button" aria-label="Show password" aria-pressed="false">Show</button></div></div>
      <p class="msg" id="siMsg"></p>
      <button class="btn" id="siBtn" type="button">Sign in</button>
      <button class="link" id="toForgot" type="button">Forgot password?</button>
    </div>

    <div id="paneFp" class="hide">
      <h2>Reset password</h2>
      <p class="sub">Enter your account email. We will send a link to set a new password.</p>
      <div class="field"><label for="fpEmail">Email</label>
        <input id="fpEmail" type="email" autocomplete="email" placeholder="warden@example.com"></div>
      <p class="msg" id="fpMsg"></p>
      <button class="btn" id="fpBtn" type="button">Send reset link</button>
      <button class="link" id="toSignin" type="button">Back to sign in</button>
    </div>
  </section>

  <!-- Desk -->
  <section id="deskView" class="hide">
    <div class="bar"><span id="who"></span><button class="out" id="outBtn" type="button">Sign out</button></div>
    <div class="tabs" role="tablist">
      <button class="tab on" id="tabPending" role="tab" type="button">Pending (0)</button>
      <button class="tab" id="tabOut" role="tab" type="button">Out now (0)</button>
    </div>
    <p class="msg" id="msg"></p>
    <div id="list"></div>
  </section>

</main>

<script>
(function () {
  // ---- Settings: use the same two values as student.html ----
  var DB_URL = "https://gandhi-hostel-default-rtdb.asia-southeast1.firebasedatabase.app";
  var API_KEY = "AIzaSyDiNFVaxdes7KXSzmEmiN51GGejtsK8qVI";
  var STORAGE_KEY = "gandhiWardenSession";
  var POLL_MS = 5000;

  var $ = function (id) { return document.getElementById(id); };
  var configured = DB_URL.indexOf("YOUR-PROJECT") === -1 && API_KEY.indexOf("YOUR-WEB") === -1;
  var base = DB_URL.replace(/\/$/, "");
  var session = null; // {uid, email, idToken, refreshToken, exp}
  var data = {};
  var tab = "pending";
  var timer = null;

  if (!configured) $("setupNotice").classList.remove("hide");

  // ---- Firebase Auth (REST) ----
  function authCall(endpoint, body) {
    return fetch("https://identitytoolkit.googleapis.com/v1/accounts:" + endpoint + "?key=" + encodeURIComponent(API_KEY), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j.error && j.error.message) || "ERROR");
        return j;
      });
    });
  }
  function setSession(uid, idToken, rt, expiresIn) {
    session = session || {};
    session.uid = uid; session.idToken = idToken; session.refreshToken = rt;
    session.exp = Date.now() + (parseInt(expiresIn, 10) || 3600) * 1000;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ rt: rt })); } catch (e) {}
  }
  function refreshSession(rt) {
    return fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(API_KEY), {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rt)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error("SESSION_EXPIRED");
        setSession(j.user_id, j.id_token, j.refresh_token, j.expires_in);
      });
    });
  }
  function token() {
    if (session.exp - Date.now() > 60000) return Promise.resolve(session.idToken);
    return refreshSession(session.refreshToken).then(function () { return session.idToken; });
  }
  function db(method, path, body) {
    return token().then(function (t) {
      return fetch(base + path + ".json?auth=" + encodeURIComponent(t), {
        method: method, headers: { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
    }).then(function (r) {
      if (!r.ok) throw new Error("DB_ERROR");
      return r.json();
    });
  }

  // ---- Helpers ----
  var ERRORS = {
    INVALID_EMAIL: "Enter a valid email address.",
    INVALID_LOGIN_CREDENTIALS: "Email or password is incorrect.",
    INVALID_PASSWORD: "Email or password is incorrect.",
    EMAIL_NOT_FOUND: "Email or password is incorrect.",
    USER_DISABLED: "This account has been disabled.",
    TOO_MANY_ATTEMPTS_TRY_LATER: "Too many attempts. Wait a few minutes and try again.",
    NOT_WARDEN: "This account is not set up as a warden account.",
    SESSION_EXPIRED: "Your session expired. Sign in again.",
    DB_ERROR: "Could not reach the database. Check the database rules."
  };
  function explain(e) {
    var code = String(e && e.message || "").split(" ")[0];
    return ERRORS[code] || "Could not connect. Check your internet connection and try again.";
  }
  function say(id, text, kind) {
    var m = $(id);
    m.textContent = text || "";
    m.className = "msg" + (text && kind ? " " + kind : "");
  }
  function busy(btn, on, label) { btn.disabled = on; btn.textContent = on ? "Please wait..." : label; }
  function fmt(iso) {
    if (!iso) return "-";
    return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---- Sign in / out ----
  function openDesk() {
    $("who").textContent = session.email || "Signed in";
    $("authView").classList.add("hide");
    $("deskView").classList.remove("hide");
    window.scrollTo(0, 0);
    load();
    clearInterval(timer);
    timer = setInterval(load, POLL_MS);
  }
  function signOut(note) {
    clearInterval(timer); timer = null;
    session = null; data = {};
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    $("deskView").classList.add("hide");
    $("authView").classList.remove("hide");
    $("paneFp").classList.add("hide");
    $("paneIn").classList.remove("hide");
    say("siMsg", note || "", note ? "bad" : "");
  }
  function checkWarden() {
    return db("GET", "/wardens/" + session.uid).then(function (ok) {
      if (ok !== true) throw new Error("NOT_WARDEN");
    });
  }

  function signIn() {
    say("siMsg", "");
    var ok = true;
    ["siEmail", "siPass"].forEach(function (id) {
      var empty = !$(id).value.trim();
      $(id).classList.toggle("invalid", empty);
      if (empty) ok = false;
    });
    if (!ok) return;
    if (!configured) return say("siMsg", "Not connected yet. Set DB_URL and API_KEY.", "bad");
    var btn = $("siBtn"); busy(btn, true);
    authCall("signInWithPassword", { email: $("siEmail").value.trim(), password: $("siPass").value, returnSecureToken: true })
      .then(function (j) {
        session = null;
        setSession(j.localId, j.idToken, j.refreshToken, j.expiresIn);
        session.email = j.email;
        return checkWarden();
      }).then(function () {
        $("siPass").value = "";
        openDesk();
      }).catch(function (e) {
        var msg = explain(e);
        session = null;
        try { localStorage.removeItem(STORAGE_KEY); } catch (x) {}
        say("siMsg", msg, "bad");
      }).then(function () { busy(btn, false, "Sign in"); });
  }

  function forgot() {
    say("fpMsg", "");
    if (!$("fpEmail").value.trim()) { $("fpEmail").classList.add("invalid"); return; }
    if (!configured) return say("fpMsg", "Not connected yet. Set DB_URL and API_KEY.", "bad");
    var btn = $("fpBtn"); busy(btn, true);
    var sent = "If this email has an account, a reset link is on its way. Check your inbox and spam folder.";
    authCall("sendOobCode", { requestType: "PASSWORD_RESET", email: $("fpEmail").value.trim() })
      .then(function () { say("fpMsg", sent, "good"); })
      .catch(function (e) {
        var code = String(e.message || "").split(" ")[0];
        if (code === "EMAIL_NOT_FOUND") say("fpMsg", sent, "good"); // do not reveal registered emails
        else say("fpMsg", explain(e), "bad");
      }).then(function () { busy(btn, false, "Send reset link"); });
  }

  // ---- Requests ----
  function load() {
    if (!session) return;
    db("GET", "/students").then(function (d) {
      data = d || {};
      say("msg", "Updated " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      render();
    }).catch(function (e) {
      if (String(e.message).indexOf("SESSION_EXPIRED") === 0) signOut(explain(e));
      else say("msg", "Cannot load requests. Retrying...", "bad");
    });
  }
  function pendingList() {
    return Object.keys(data).filter(function (k) {
      var p = data[k] && data[k].pending; return p && p.status === "pending";
    }).sort(function (a, b) { return data[a].pending.requestedAt < data[b].pending.requestedAt ? -1 : 1; });
  }
  function outList() {
    return Object.keys(data).filter(function (k) { return data[k] && data[k].state === "out"; })
      .sort(function (a, b) { return (data[a].lastOut || "") < (data[b].lastOut || "") ? 1 : -1; });
  }

  function render() {
    var p = pendingList(), o = outList();
    $("tabPending").textContent = "Pending (" + p.length + ")";
    $("tabOut").textContent = "Out now (" + o.length + ")";
    $("tabPending").classList.toggle("on", tab === "pending");
    $("tabOut").classList.toggle("on", tab === "out");
    var list = $("list");
    list.innerHTML = "";

    if (tab === "pending") {
      if (!p.length) { list.appendChild(el("div", "empty", "No requests waiting.")); return; }
      p.forEach(function (k) {
        var s = data[k], req = s.pending, going = req.type === "out";
        var card = el("div", "item" + (going ? "" : " in"));
        var top = el("div", "top");
        top.appendChild(el("h3", "nm", s.name || k));
        top.appendChild(el("span", "tag " + (going ? "out" : "in"), going ? "Going out" : "Coming in"));
        card.appendChild(top);
        card.appendChild(el("p", "meta", "ID " + (s.id || k) + "  |  Room " + (s.room || "-") + (s.dept ? "  |  " + s.dept : "")));
        if (req.purpose) card.appendChild(el("p", "meta", "Purpose: " + req.purpose));
        card.appendChild(el("p", "meta", (going ? "Exit time " : "Entry time ") + fmt(req.time || req.requestedAt) + "  (requested " + fmt(req.requestedAt) + ")"));
        var acts = el("div", "acts");
        var yes = el("button", "act ok", "Approve"); yes.type = "button";
        var no = el("button", "act no", "Decline"); no.type = "button";
        yes.addEventListener("click", function () { decide(k, true, yes, no); });
        no.addEventListener("click", function () { decide(k, false, yes, no); });
        acts.appendChild(yes); acts.appendChild(no);
        card.appendChild(acts);
        list.appendChild(card);
      });
    } else {
      if (!o.length) { list.appendChild(el("div", "empty", "Everyone is inside the hostel.")); return; }
      o.forEach(function (k) {
        var s = data[k];
        var card = el("div", "item");
        var top = el("div", "top");
        top.appendChild(el("h3", "nm", s.name || k));
        top.appendChild(el("span", "tag out", "Out"));
        card.appendChild(top);
        card.appendChild(el("p", "meta", "ID " + (s.id || k) + "  |  Room " + (s.room || "-") + (s.dept ? "  |  " + s.dept : "")));
        card.appendChild(el("p", "meta", "Left at " + fmt(s.lastOut)));
        if (s.lastPurpose) card.appendChild(el("p", "meta", "Purpose: " + s.lastPurpose));
        list.appendChild(card);
      });
    }
  }

  function decide(key, approve, yes, no) {
    var s = data[key], req = s.pending;
    var now = new Date().toISOString(); // decision time is recorded automatically
    var pending = { type: req.type, requestedAt: req.requestedAt, time: req.time, purpose: req.purpose, status: approve ? "approved" : "rejected", decidedAt: now, decidedBy: session.email || session.uid };
    var update = { pending: pending };
    if (approve) {
      pending.approvedAt = now;
      update.state = req.type === "out" ? "out" : "in";
      if (req.type === "out") { update.lastOut = now; update.lastPurpose = req.purpose || ""; } else update.lastIn = now;
    }
    yes.disabled = no.disabled = true;
    db("PATCH", "/students/" + encodeURIComponent(key), update).then(function () {
      if (!approve) return;
      return db("POST", "/log", {
        name: s.name, id: s.id, room: s.room, dept: s.dept || "", hostel: "Gandhi Hostel", type: req.type,
        requestedAt: req.requestedAt, time: req.time || req.requestedAt, purpose: req.purpose || "", approvedAt: now, approvedBy: session.email || session.uid
      });
    }).then(load).catch(function (e) {
      say("msg", "Could not save. " + explain(e), "bad");
      yes.disabled = no.disabled = false;
    });
  }

  // ---- Wiring ----
  $("siBtn").addEventListener("click", signIn);
  $("fpBtn").addEventListener("click", forgot);
  $("outBtn").addEventListener("click", function () { signOut(); });
  $("toForgot").addEventListener("click", function () {
    $("fpEmail").value = $("siEmail").value;
    say("fpMsg", "");
    $("paneIn").classList.add("hide"); $("paneFp").classList.remove("hide");
  });
  $("toSignin").addEventListener("click", function () {
    $("paneFp").classList.add("hide"); $("paneIn").classList.remove("hide");
  });
  $("tabPending").addEventListener("click", function () { tab = "pending"; render(); });
  $("tabOut").addEventListener("click", function () { tab = "out"; render(); });
  $("siPass").addEventListener("keydown", function (e) { if (e.key === "Enter") signIn(); });
  $("fpEmail").addEventListener("keydown", function (e) { if (e.key === "Enter") forgot(); });
  ["siEmail", "siPass", "fpEmail"].forEach(function (id) {
    $(id).addEventListener("input", function () { $(id).classList.remove("invalid"); });
  });

  // Show / hide password
  $("pwBtn").addEventListener("click", function () {
    var input = $("siPass"), hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    this.textContent = hidden ? "Hide" : "Show";
    this.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    this.setAttribute("aria-pressed", hidden ? "true" : "false");
  });

  // Stay signed in on this phone
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (configured && saved && saved.rt) {
      refreshSession(saved.rt).then(function () {
        return authCall("lookup", { idToken: session.idToken });
      }).then(function (j) {
        session.email = j.users && j.users[0] && j.users[0].email;
        return checkWarden();
      }).then(openDesk).catch(function () { session = null; });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
